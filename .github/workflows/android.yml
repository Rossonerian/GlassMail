name: Native Android checks

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest'
      - name: Install Android platform tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android 35 platform
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35'
      - name: Install Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Kotlin unit tests
        run: ./gradlew --max-workers=2 --no-parallel test
      - name: Run Android lint
        run: ./gradlew --max-workers=2 --no-parallel lintDebug
      - name: Compile release with R8 (unsigned CI check only)
        run: ./gradlew --max-workers=2 --no-parallel :app:assembleRelease
      - name: Assemble debug APK
        run: ./gradlew --max-workers=2 --no-parallel :app:assembleDebug
