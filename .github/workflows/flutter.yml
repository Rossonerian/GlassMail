name: Experimental Flutter build and checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # The runner includes API 36 and Build Tools 36.0.0 for Flutter's AGP 9.1.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: dart run build_runner build
        working-directory: flutter_app/packages/core_database
      - run: flutter analyze
        working-directory: flutter_app/packages/core_database
      - run: flutter test
        working-directory: flutter_app/packages/core_database
      - run: flutter analyze
        working-directory: flutter_app/packages/core_security
      - run: flutter test
        working-directory: flutter_app/packages/core_security
      - run: flutter analyze
        working-directory: flutter_app/packages/core_imap
      - run: flutter test
        working-directory: flutter_app/packages/core_imap
      - run: flutter test packages/core_model/test
      - run: flutter analyze
        working-directory: flutter_app/packages/core_model
      - run: flutter test packages/domain_mail/test
      - run: flutter analyze
        working-directory: flutter_app/packages/domain_mail
      - run: flutter analyze
        working-directory: flutter_app/packages/data_mail
      - run: flutter test
        working-directory: flutter_app/packages/data_mail
      # The app selects a release signing config, so supply a disposable CI key.
      # This bundle is a build check and must never be published as a release.
      - name: Create temporary CI signing key
        run: >-
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/flutter-ci.jks"
          -storetype JKS -storepass android -keypass android -alias ci
          -keyalg RSA -keysize 2048 -validity 1 -dname "CN=GlassMail CI"
      - name: Build release app bundle (CI signing only)
        env:
          GLASSMAIL_KEYSTORE: ${{ runner.temp }}/flutter-ci.jks
          GLASSMAIL_KEYSTORE_PASSWORD: android
          GLASSMAIL_KEY_ALIAS: ci
          GLASSMAIL_KEY_PASSWORD: android
        run: flutter build appbundle --release

  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: dart run build_runner build
        working-directory: flutter_app/packages/core_database
      - run: flutter analyze
        working-directory: flutter_app/packages/core_database
      - run: flutter test
        working-directory: flutter_app/packages/core_database
      - run: flutter analyze
        working-directory: flutter_app/packages/core_security
      - run: flutter test
        working-directory: flutter_app/packages/core_security
      - run: flutter analyze
        working-directory: flutter_app/packages/core_imap
      - run: flutter test
        working-directory: flutter_app/packages/core_imap
      - run: flutter test packages/core_model/test
      - run: flutter analyze
        working-directory: flutter_app/packages/core_model
      - run: flutter test packages/domain_mail/test
      - run: flutter analyze
        working-directory: flutter_app/packages/domain_mail
      - run: flutter analyze
        working-directory: flutter_app/packages/data_mail
      - run: flutter test
        working-directory: flutter_app/packages/data_mail
      - run: flutter build ios --simulator --no-codesign
