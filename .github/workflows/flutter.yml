name: Flutter build and checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: flutter-actions/setup-flutter@v4.2
        with:
          version: '3.47.5'
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: dart run build_runner build
        working-directory: flutter_app/packages/core_database
      - run: flutter analyze
        working-directory: flutter_app/packages/core_database
      - run: flutter test
        working-directory: flutter_app/packages/core_database
      - run: flutter analyze
        working-directory: flutter_app/packages/core_security
      - run: flutter test
        working-directory: flutter_app/packages/core_security
      - run: flutter analyze
        working-directory: flutter_app/packages/core_imap
      - run: flutter test
        working-directory: flutter_app/packages/core_imap
      - run: flutter test packages/core_model/test
      - run: flutter analyze
        working-directory: flutter_app/packages/core_model
      - run: flutter test packages/domain_mail/test
      - run: flutter analyze
        working-directory: flutter_app/packages/domain_mail
      - run: flutter analyze
        working-directory: flutter_app/packages/data_mail
      - run: flutter test
        working-directory: flutter_app/packages/data_mail
      - run: flutter build appbundle --release

  ios-simulator:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: flutter-actions/setup-flutter@v4.2
        with:
          version: '3.47.5'
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: dart run build_runner build
        working-directory: flutter_app/packages/core_database
      - run: flutter analyze
        working-directory: flutter_app/packages/core_database
      - run: flutter test
        working-directory: flutter_app/packages/core_database
      - run: flutter analyze
        working-directory: flutter_app/packages/core_security
      - run: flutter test
        working-directory: flutter_app/packages/core_security
      - run: flutter analyze
        working-directory: flutter_app/packages/core_imap
      - run: flutter test
        working-directory: flutter_app/packages/core_imap
      - run: flutter test packages/core_model/test
      - run: flutter analyze
        working-directory: flutter_app/packages/core_model
      - run: flutter test packages/domain_mail/test
      - run: flutter analyze
        working-directory: flutter_app/packages/domain_mail
      - run: flutter analyze
        working-directory: flutter_app/packages/data_mail
      - run: flutter test
        working-directory: flutter_app/packages/data_mail
      - run: flutter build ios --simulator --no-codesign
