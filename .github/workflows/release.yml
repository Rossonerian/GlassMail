name: Native release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_FILE: ${{ runner.temp }}/glassmail-release.jks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate native version and tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          source = Path('app/build.gradle.kts').read_text()
          names = re.findall(r'^\s*versionName\s*=\s*"([^"]+)"\s*$', source, re.M)
          codes = re.findall(r'^\s*versionCode\s*=\s*(\d+)\s*$', source, re.M)
          if len(names) != 1 or len(codes) != 1 or not re.fullmatch(r'\d+\.\d+\.\d+', names[0]):
              raise SystemExit('Cannot determine a unique native release version.')
          version, code = names[0], codes[0]
          major, minor, patch = map(int, version.split('.'))
          if minor > 99 or patch > 99 or int(code) != major * 10000 + minor * 100 + patch:
              raise SystemExit('Native versionCode does not match the documented version policy.')
          tag = 'v' + version
          if os.environ['EVENT_NAME'] == 'push' and os.environ['REF_NAME'] != tag:
              raise SystemExit('Release tag must exactly equal v + native versionName: ' + tag)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\ncode={code}\ntag={tag}\n')
          PY
      - name: Require signing secrets and decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.GLASSMAIL_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.GLASSMAIL_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GLASSMAIL_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GLASSMAIL_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$KEYSTORE_BASE64" ]] || missing+=(GLASSMAIL_RELEASE_KEYSTORE_BASE64)
          [[ -n "$STORE_PASSWORD" ]] || missing+=(GLASSMAIL_RELEASE_STORE_PASSWORD)
          [[ -n "$KEY_ALIAS" ]] || missing+=(GLASSMAIL_RELEASE_KEY_ALIAS)
          [[ -n "$KEY_PASSWORD" ]] || missing+=(GLASSMAIL_RELEASE_KEY_PASSWORD)
          if (( ${#missing[@]} )); then
            printf '::error::Missing required signing secrets: %s\n' "${missing[*]}"
            exit 1
          fi
          # GitHub masks secret values automatically; also mask normalized base64.
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          try:
              payload = base64.b64decode(''.join(os.environ['KEYSTORE_BASE64'].split()), validate=True)
          except ValueError:
              raise SystemExit('Signing keystore secret is not valid base64.')
          if not payload:
              raise SystemExit('Signing keystore secret decoded to an empty file.')
          # Register single-line encodings that might otherwise appear in tool output.
          print('::add-mask::' + base64.b64encode(payload).decode())
          path = Path(os.environ['KEYSTORE_FILE'])
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, 'wb') as output:
              output.write(payload)
          path.chmod(0o600)
          PY
      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/release-notes.md"
      - name: Test, lint, and build signed native artifacts
        env:
          GLASSMAIL_REQUIRE_RELEASE_SIGNING: 'true'
          GLASSMAIL_RELEASE_STORE_FILE: ${{ env.KEYSTORE_FILE }}
          GLASSMAIL_RELEASE_STORE_PASSWORD: ${{ secrets.GLASSMAIL_RELEASE_STORE_PASSWORD }}
          GLASSMAIL_RELEASE_KEY_ALIAS: ${{ secrets.GLASSMAIL_RELEASE_KEY_ALIAS }}
          GLASSMAIL_RELEASE_KEY_PASSWORD: ${{ secrets.GLASSMAIL_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --max-workers=2 --no-parallel test lint :app:assembleRelease :app:bundleRelease
      - name: Verify APK and prepare artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          [[ -x "$build_tools/apksigner" && -x "$build_tools/aapt2" ]] || {
            echo '::error::Latest Android build-tools lacks apksigner or aapt2.'
            exit 1
          }
          apk=app/build/outputs/apk/release/app-release.apk
          aab=app/build/outputs/bundle/release/app-release.aab
          [[ -s "$apk" && -s "$aab" ]] || {
            echo '::error::Signed native release APK/AAB missing.'
            exit 1
          }
          # Keep verbose certificate details out of the log, even on failure.
          if ! "$build_tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-signature.txt" 2>&1; then
            echo '::error::APK signature verification failed.'
            exit 1
          fi
          grep -Eq '^Verified using v3 scheme .*: true$' "$RUNNER_TEMP/apk-signature.txt" || {
            echo '::error::APK v3 signature verification must be true.'
            exit 1
          }
          grep -E '^Signer #[0-9]+ certificate SHA-256 digest: [[:xdigit:]]+$' "$RUNNER_TEMP/apk-signature.txt"
          "$build_tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          badging = Path(os.environ['RUNNER_TEMP'], 'apk-badging.txt').read_text()
          package = re.search(r'^package: (.*)$', badging, re.M)
          fields = dict(re.findall(r"(\w+)='([^']*)'", package[1])) if package else {}
          expected = {'name': 'com.glassmail.app', 'versionName': os.environ['VERSION'],
                      'versionCode': os.environ['VERSION_CODE']}
          if any(fields.get(key) != value for key, value in expected.items()):
              raise SystemExit('APK applicationId or version metadata does not match the native release.')
          if re.search(r'^application-debuggable(?:\s|:|$)', badging, re.M):
              raise SystemExit('Release APK must not be debuggable.')
          PY
          # Verify the bundle signature too before distributing it.
          if ! jarsigner -verify "$aab" > "$RUNNER_TEMP/aab-signature.txt" 2>&1 ||
             ! grep -q '^jar verified\.' "$RUNNER_TEMP/aab-signature.txt"; then
            echo '::error::AAB signature verification failed.'
            exit 1
          fi
          mkdir -p release-artifacts
          cp "$apk" "release-artifacts/GlassMail-$RELEASE_TAG.apk"
          cp "$aab" "release-artifacts/GlassMail-$RELEASE_TAG.aab"
          cd release-artifacts
          sha256sum "GlassMail-$RELEASE_TAG.apk" > "GlassMail-$RELEASE_TAG.apk.sha256"
          sha256sum -c "GlassMail-$RELEASE_TAG.apk.sha256"
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GlassMail-${{ steps.version.outputs.tag }}
          path: release-artifacts/*
          if-no-files-found: error
      - name: Publish GitHub Release on tag push
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            "release-artifacts/GlassMail-$RELEASE_TAG.apk" \
            "release-artifacts/GlassMail-$RELEASE_TAG.aab" \
            "release-artifacts/GlassMail-$RELEASE_TAG.apk.sha256" \
            --verify-tag --title "GlassMail $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Remove signing keystore
        if: always()
        shell: bash
        run: rm -f -- "$KEYSTORE_FILE"
